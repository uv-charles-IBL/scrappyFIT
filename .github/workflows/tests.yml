name: tests

on:
  push:
  pull_request:

jobs:
  fast:
    # pinned: ubuntu-latest moves to Ubuntu 26 from 2026-10-19
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # 3.10 installs the pinned ci-constraints.txt; 3.11 and 3.12 take
        # the newest releases pyproject.toml allows, as a new user would
        python-version: ['3.10', '3.11', '3.12']
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            ci-constraints.txt
      - name: Qt runtime libraries (offscreen still needs them)
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - name: Install (pinned, 3.10)
        if: matrix.python-version == '3.10'
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev] -c ci-constraints.txt
      - name: Install (latest releases)
        if: matrix.python-version != '3.10'
        run: |
          python -m pip install --upgrade pip
          pip install .[dev]
      - name: Fast tests
        run: python -m pytest tests/ -q -m "not slow"

  slow:
    # GUI journeys and the other slow tests. The golden spectra skip themselves
    # here (CI=true): their pins reproduce only on Charles's desktop, so they are
    # a local check before merging (CLAUDE.md, Tests).
    runs-on: windows-2022
    env:
      QT_QPA_PLATFORM: offscreen
      # GUI step budgets were measured on Charles's desktop; the runner is slower
      SCRAPPYFIT_BUDGET_SCALE: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            ci-constraints.txt
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev] -c ci-constraints.txt
      # No lab spectra on CI: the journeys run on tests/data/synthetic_quartz.txt,
      # against budgets measured on the lab spectra (tests/labdata.py).
      - name: Slow tests (GUI journeys; golden spectra skip on CI)
        run: python -m pytest tests/ -q -m slow
